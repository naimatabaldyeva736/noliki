<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 КРЕСТИКИ-НОЛИКИ</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Главное меню -->
    <div id="main-menu" class="screen active">
        <div class="menu-content">
            <h1 class="game-title">🎮 КРЕСТИКИ-НОЛИКИ</h1>
            <p class="welcome-text">«Сыграй и проверь свою смекалку!»</p>
            <div class="menu-buttons">
                <button id="start-game-btn" class="btn btn-primary">🚀 Начать игру</button>
            </div>
        </div>
    </div>

    <!-- Игровой экран -->
    <div id="game-screen" class="screen">
        <div class="game-container">
            <header class="game-header">
                <h2 class="sub-title">🎮 КРЕСТИКИ-НОЛИКИ</h2>
                <div id="game-status" class="status-badge">Ход игрока ❌</div>
            </header>

            <!-- Игровое поле 3x3 -->
            <div class="board" id="board">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>

            <!-- Кнопки управления -->
            <div class="action-buttons">
                <button id="new-game-btn" class="btn btn-secondary">🔄 Новая игра</button>
                <button id="restart-btn" class="btn btn-warning">↩️ Начать заново</button>
                <button id="menu-btn" class="btn btn-danger">🏠 Главное меню</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
